<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 300px;
    }
    .question {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .option {
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      background-color: #f9f9f9;
    }
    .option:hover {
      background-color: #e6f0ff;
    }
    .correct {
      background-color: #d4edda !important;
      border-color: #28a745 !important;
    }
    .wrong {
      background-color: #f8d7da !important;
      border-color: #dc3545 !important;
    }
    .footer {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="quiz">Loading quiz from video...</div>
  <div class="footer">Created by Deepesh Bansal</div>
  <script src="popup.js"></script>
</body>
</html>
