<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 300px;
    }
    .settings {
      margin-bottom: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .setting-item {
      margin-bottom: 10px;
    }
    .setting-item label {
      display: block;
      margin-bottom: 3px;
      font-size: 13px;
      font-weight: bold;
    }
    .setting-item select, .setting-item input {
      width: 100%;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #generateBtn {
      width: 100%;
      padding: 8px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    #generateBtn:hover {
      background: #45a049;
    }
    .question {
      font-weight: bold;
      margin-bottom: 10px;
    }
    .option {
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      background-color: #f9f9f9;
    }
    .option:hover {
      background-color: #e6f0ff;
    }
    .correct {
      background-color: #d4edda !important;
      border-color: #28a745 !important;
    }
    .wrong {
      background-color: #f8d7da !important;
      border-color: #dc3545 !important;
    }
    .footer {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="settings">
    <div class="setting-item">
      <label for="level">Quiz Level:</label>
      <select id="level">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="numQuestions">Number of Questions:</label>
      <input type="number" id="numQuestions" min="5" max="20" value="10">
    </div>
    <button id="generateBtn">Generate Quiz</button>
  </div>
  <div id="quiz"></div>
  <div class="footer">Created by Deepesh Bansal</div>
  <script src="popup.js"></script>
</body>
</html>
