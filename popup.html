<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InstaEval Quiz</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #192438;
      background: #f5f7fb;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 18px;
      background: linear-gradient(160deg, #f8faff 0%, #f1f5fb 100%);
    }
    .app-header { display: flex; align-items: center; gap: 11px; margin: 0 0 16px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #6858e8, #4389ed);
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 5px 13px #615de63b;
    }
    .eyebrow { margin: 0 0 2px; color: #71809a; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; font-size: 19px; letter-spacing: -.03em; }
    .settings {
      margin-bottom: 14px;
      padding: 15px;
      border: 1px solid #e3e8f1;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 7px 24px #263b5c0a;
    }
    .setting-item { margin-bottom: 13px; }
    .setting-item label {
      display: block;
      margin-bottom: 6px;
      color: #59677e;
      font-size: 11px;
      font-weight: 750;
    }
    .setting-item select, .setting-item input {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #dce3ee;
      border-radius: 9px;
      outline: none;
      color: #243149;
      background: #fbfcfe;
      font: inherit;
      font-size: 13px;
    }
    .setting-item select:focus, .setting-item input:focus {
      border-color: #7667e9;
      box-shadow: 0 0 0 3px #7667e91c;
    }
    button { font: inherit; }
    .primary-button {
      width: 100%;
      min-height: 40px;
      padding: 10px 13px;
      border-radius: 10px;
      color: #fff;
      background: linear-gradient(105deg, #695ce4, #507ee8);
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 5px 12px #5e68df2b;
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    .primary-button:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 7px 16px #5e68df38; }
    .primary-button:focus-visible, .option:focus-visible { outline: 3px solid #8579f0; outline-offset: 2px; }
    .primary-button:disabled { cursor: wait; filter: grayscale(.2); opacity: .7; }
    .quiz-card {
      min-height: 112px;
      padding: 15px;
      border: 1px solid #e3e8f1;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 7px 24px #263b5c0a;
    }
    .progress-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; font-size: 10px; font-weight: 750; }
    .progress-label { color: #65738a; }
    .score-label { color: #6358d9; }
    .progress-bar { display: block; width: 100%; height: 5px; margin-bottom: 15px; border: 0; border-radius: 9px; overflow: hidden; accent-color: #6d63e6; }
    .question { margin: 0 0 13px; font-size: 15px; line-height: 1.45; letter-spacing: -.015em; }
    .options { display: grid; gap: 8px; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      width: 100%;
      padding: 10px;
      border: 1px solid #e1e7f0;
      border-radius: 9px;
      color: #36445a;
      background: #fbfcfe;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      line-height: 1.45;
      transition: border-color .15s ease, background .15s ease;
    }
    .option:hover:not(:disabled) { border-color: #aaa2f1; background: #f6f5ff; }
    .option:disabled { cursor: default; }
    .option-letter { flex: 0 0 20px; color: #7065dc; font-weight: 800; }
    .option.correct { border-color: #51b889; background: #edfaf4; color: #176544; }
    .option.correct .option-letter { color: #21845b; }
    .option.wrong { border-color: #e48a8a; background: #fff1f0; color: #8e3a3a; }
    .option.wrong .option-letter { color: #bb5151; }
    .feedback { margin: 12px 0 9px; font-size: 12px; font-weight: 700; }
    .feedback-correct { color: #21845b; }
    .feedback-wrong { color: #a34848; }
    .next-button { margin-top: 3px; }
    .message { margin: 0; color: #68768c; font-size: 12px; line-height: 1.5; }
    .message.error { color: #a34444; }
    .results-kicker { margin: 4px 0 3px; color: #6b61df; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .results-title { margin: 0 0 8px; font-size: 21px; }
    .results-score { margin: 0; font-size: 16px; font-weight: 750; }
    .results-detail { margin: 4px 0 14px; color: #748198; font-size: 12px; }
    .footer { margin: 12px 3px 0; color: #8792a5; font-size: 10px; text-align: center; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand-mark" aria-hidden="true">IE</div>
    <div>
      <p class="eyebrow">INSTA EVAL</p>
      <h1>Quick quiz</h1>
    </div>
  </header>
  <div class="settings">
    <div class="setting-item">
      <label for="level">Quiz Level:</label>
      <select id="level">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="numQuestions">Number of Questions:</label>
        <input type="number" id="numQuestions" min="5" max="20" step="1" value="10">
      </div>
    <button class="primary-button" id="generateBtn" type="button">Generate Quiz</button>
  </div>
  <section class="quiz-card" id="quiz" aria-live="polite" aria-atomic="true">
    <p class="message">Choose a difficulty and question count, then generate a quiz from this page.</p>
  </section>
  <div class="footer">Created by Deepesh Bansal</div>
  <script src="popup.js"></script>
</body>
</html>
